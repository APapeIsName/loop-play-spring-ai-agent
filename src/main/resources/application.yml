spring:
  application:
    name: baedal-support-agent
  # default 프로필 시 DataSource auto-config 비활성 — h2 classpath가 임베디드 DS를 자동 띄워
  # JdbcChatMemoryRepository(auto) + chatMemoryRepository(@Profile("!jdbc")) 2개 Bean 충돌하는 사고 방지.
  # jdbc 프로필에서는 application-jdbc.yml이 이 exclude를 빈 배열로 덮어쓴다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5
        options:
          temperature: 0.3

logging:
  level:
    org.springframework.ai: DEBUG
